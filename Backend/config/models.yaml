        index_dir: "knowledge_base/vector_store"
        chunk_max_len: 512
        chunk_overlap: 64

  retrieval:
    faiss:
      name: "FAISS Retrieval (E5-Large)"
      provider: "faiss"
      model_id: "intfloat/multilingual-e5-large"
      license: "MIT"
      quantization: "none"
      vram_mb: 560
      params:
        index_dir: "knowledge_base/vector_store"
        top_k: 3
        min_score: 0.30
        query_prefix: "query: "

    faiss_bge:
      name: "FAISS Retrieval (BGE-Small)"
      provider: "faiss"
      model_id: "BAAI/bge-small-en-v1.5"
      license: "MIT"
      quantization: "none"
      vram_mb: 130
      params:
        index_dir: "knowledge_base/vector_store"
        top_k: 5
        min_score: 0.25

    ollama:
      name: "FAISS Retrieval (Qwen3-Embedding-0.6B via Ollama)"
      provider: "ollama"
      ollama_model: "qwen3-embedding:0.6b"
      license: "Apache-2.0"
      quantization: "q8_0"
      vram_mb: 0
      params:
        ollama_url: "http://localhost:11434"
        index_dir: "knowledge_base/vector_store"
        top_k: 1
        min_score: 0.35

  knowledge_graph:
    networkx:
      name: "NetworkX Graph KB"
      provider: "networkx"
      license: "BSD-3-Clause"
      quantization: "none"
      vram_mb: 50
      params:
        kb_dir: "knowledge_base/graph"

  vlm:
    florence2:
      name: "Florence-2-Base"
      provider: "huggingface"
      model_id: "microsoft/Florence-2-base"
      license: "MIT"
      quantization: "int4"
      vram_mb: 150
      params:
        trust_remote_code: true
        torch_dtype: "float16"
        task_prompt: "<OCR>"

    moondream2:
      name: "Moondream2"
      provider: "huggingface"
      model_id: "vikhyatk/moondream2"
      license: "Apache-2.0"
      quantization: "int4"
      vram_mb: 1100
      params:
        trust_remote_code: true
        torch_dtype: "float16"

    ollama_vlm:
      name: "MiniCPM-V 4.6 via Ollama (PDF/Document OCR)"
      provider: "ollama"
      ollama_model: "openbmb/minicpm-v4.6"
      license: "Apache-2.0"
      quantization: "q4_0"
      vram_mb: 0
      params:
        ollama_url: "http://localhost:11434"
        task_prompt: "Extract all text from this document image. Output only the extracted text."

