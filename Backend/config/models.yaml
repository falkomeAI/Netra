models:
  preprocessing:
    opencv:
      name: "OpenCV Preprocessing"
      provider: "opencv"
      license: "Apache-2.0"
      vram_mb: 0
      params:
        denoise_h: 10
        clahe_clip: 2.0
        binarize_block: 11

  ocr:
    paddleocr:
      name: "PaddleOCR v4"
      provider: "paddleocr"
      version: "4"
      license: "Apache-2.0"
      quantization: "int4"
      vram_mb: 150
      languages: ["hi", "ta", "te", "bn", "mr", "gu", "kn", "ml", "pa", "or", "as", "ur", "en"]
      params:
        use_angle_cls: true
        lang: "hi"
        use_gpu: true
        show_log: false
        det_model_dir: null
        rec_model_dir: null
        cls_model_dir: null

    easyocr:
      name: "EasyOCR"
      provider: "easyocr"
      license: "Apache-2.0"
      quantization: "none"
      vram_mb: 200
      languages: ["hi", "ta", "te", "bn", "mr", "gu", "kn", "ml", "pa", "ur", "en"]
      params:
        languages: ["en", "hi"]

    surya:
      name: "Surya OCR"
      provider: "surya"
      license: "GPL-3.0"
      quantization: "int4"
      vram_mb: 400
      languages: ["hi", "ta", "te", "bn", "mr", "gu", "kn", "ml", "pa", "or", "as", "ur", "en"]
      params:
        batch_size: 1

    got_ocr:
      name: "GOT-OCR 2.0"
      provider: "huggingface"
      model_id: "stepfun-ai/GOT-OCR2_0"
      license: "Apache-2.0"
      quantization: "int4"
      vram_mb: 350
      languages: ["hi", "ta", "te", "bn", "en"]
      params:
        trust_remote_code: true

  asr:
    bhashini_asr:
      name: "Bhashini ASR (ULCA)"
      provider: "bhashini"
      license: "Government of India"
      quantization: "none"
      vram_mb: 0
      languages: ["hi", "ta", "te", "bn", "mr", "gu", "kn", "ml", "pa", "or", "as", "ur", "en", "sa", "kok", "ks", "mai", "mni", "ne", "sd", "brx", "doi"]
      params:
        offline_fallback: "indicwhisper"

    indicconformer:
      name: "AI4Bharat IndicConformer (NeMo)"
      provider: "nemo"
      model_id: "ai4bharat/indicconformer_stt_hi_hybrid_ctc_rnnt_large"
      license: "CC-BY-4.0"
      quantization: "none"
      vram_mb: 300
      languages: ["hi", "ta", "te", "bn", "mr", "gu", "kn", "ml", "pa", "or", "as", "ur", "en", "sa", "kok", "ks", "mai", "mni", "ne", "sd", "brx", "doi", "sat"]
      params:
        default_language: "hi"

    indicwhisper:
      name: "IndicWhisper (Hindi)"
      provider: "ctranslate2"
      model_id: "Systran/faster-whisper-small"
      license: "MIT"
      quantization: "int4"
      vram_mb: 150
      languages: ["hi", "ta", "te", "bn", "mr", "gu", "kn", "ml", "pa", "or", "as", "ur", "en"]
      params:
        compute_type: "int8_float16"
        beam_size: 5
        vad_filter: true

    whisper_small:
      name: "Whisper Small"
      provider: "ctranslate2"
      model_id: "Systran/faster-whisper-small"
      license: "MIT"
      quantization: "int4"
      vram_mb: 150
      languages: ["hi", "ta", "te", "bn", "mr", "gu", "kn", "ml", "en"]
      params:
        compute_type: "int8"
        beam_size: 5
        vad_filter: true

    distil_whisper:
      name: "Distil-Whisper Small"
      provider: "ctranslate2"
      model_id: "distil-whisper/distil-small.en"
      license: "MIT"
      quantization: "int4"
      vram_mb: 100
      languages: ["en"]
      params:
        compute_type: "int8_float16"
        beam_size: 5

  llm:
    qwen2_5_3b:
      name: "Qwen2.5-3B-Instruct"
      provider: "huggingface"
      model_id: "Qwen/Qwen2.5-3B-Instruct-AWQ"
      license: "Apache-2.0"
      quantization: "awq"
      bits: 4
      vram_mb: 1800
      context_length: 32768
      languages: ["hi", "ta", "te", "bn", "mr", "gu", "kn", "ml", "pa", "or", "en"]
      params:
        trust_remote_code: true
        torch_dtype: "float16"
        device_map: "auto"
        max_new_tokens: 512

    gemma2_2b:
      name: "Gemma-2-2B-IT"
      provider: "huggingface"
      model_id: "TechxGenus/gemma-2-2b-it-GPTQ-Int4"
